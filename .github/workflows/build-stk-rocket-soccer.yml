name: Build STK Rocket Soccer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 EXE (official MinGW path)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v6

      - name: Decode mod bundle
        run: |
          base64 -d mod/stk_rocket_soccer_mod.zip.b64 > stk_rocket_soccer_mod.zip
          unzip -q stk_rocket_soccer_mod.zip -d mod-unpacked

      - name: Clone pinned SuperTuxKart
        run: |
          git clone https://github.com/supertuxkart/stk-code.git
          cd stk-code
          git checkout c6b127792e8ecdf82c28fdd9c8023cffb7084dc0

      - name: Apply Rocket Soccer patch
        run: |
          python3 mod-unpacked/stk_rocket_soccer_mod/apply_rocket_soccer.py stk-code --check
          python3 mod-unpacked/stk_rocket_soccer_mod/apply_rocket_soccer.py stk-code
          python3 - <<'PY'
          from pathlib import Path
          p = Path('stk-code/src/modes/soccer_world.cpp')
          s = p.read_text()
          if '#include <ISceneManager.h>' not in s:
              s = s.replace('#include <IMeshSceneNode.h>', '#include <IMeshSceneNode.h>\n#include <ISceneManager.h>')
              p.write_text(s)
          PY

      - name: Download STK Windows dependencies
        working-directory: stk-code
        run: |
          curl -L --fail -o dependencies-win-x86_64.zip https://github.com/supertuxkart/dependencies/releases/download/preview/dependencies-win-x86_64.zip
          unzip -q dependencies-win-x86_64.zip

      - name: Install official MXE MinGW toolchain
        run: |
          sudo mkdir -p /data/mxe/usr
          cd /data/mxe/usr
          sudo curl -L --fail -o mxe_static_mingw.zip https://github.com/supertuxkart/dependencies/releases/download/preview/mxe_static_mingw.zip
          sudo unzip -q mxe_static_mingw.zip
          sudo rm mxe_static_mingw.zip
          sudo apt-get update
          sudo apt-get install -y libfl-dev

      - name: Install ISPC used by official STK Windows workflow
        run: |
          sudo mkdir -p /opt/ispc
          curl -L --fail -o ispc-cross.tar.xz https://github.com/supertuxkart/dependencies/releases/download/preview/ispc-cross-1.26.0.tar.xz
          sudo tar -xJf ispc-cross.tar.xz -C /opt
          test -x /opt/ispc/bin/ispc

      - name: Create x86_64 MinGW CMake toolchain
        working-directory: stk-code
        run: |
          cat > toolchain.cmake <<'EOF'
          SET(CMAKE_SYSTEM_NAME Windows)
          SET(CMAKE_C_COMPILER /data/mxe/usr/bin/x86_64-w64-mingw32.static.posix.seh-gcc)
          SET(CMAKE_CXX_COMPILER /data/mxe/usr/bin/x86_64-w64-mingw32.static.posix.seh-g++)
          SET(CMAKE_RC_COMPILER /data/mxe/usr/bin/x86_64-w64-mingw32.static.posix.seh-windres)
          SET(CMAKE_FIND_ROOT_PATH ${PROJECT_SOURCE_DIR}/dependencies-win-x86_64 /data/mxe/usr/x86_64-w64-mingw32.static.posix.seh/ /data/mxe/usr/lib/gcc/x86_64-w64-mingw32.static.posix.seh/5.5.0/)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ALWAYS)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(ISPC_ARCH "x86-64")
          EOF

      - name: Configure MinGW x86_64
        working-directory: stk-code
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=../toolchain.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCHECK_ASSETS=OFF \
            -DUSE_DIRECTX=ON \
            -DBC7_ISPC=ON \
            -DCMAKE_ISPC_COMPILER=/opt/ispc/bin/ispc

      - name: Build Windows EXE
        working-directory: stk-code/build
        run: make -j4

      - name: Verify MinGW runtime folder
        run: |
          test -f stk-code/build/bin/supertuxkart.exe
          echo "Windows runtime files:"
          ls -lah stk-code/build/bin
          file stk-code/build/bin/supertuxkart.exe
          if [ -f stk-code/build/bin/OpenAL32.dll ]; then
            file stk-code/build/bin/OpenAL32.dll
          fi

      - name: Download Windows assets
        run: |
          mkdir -p stk-assets
          curl -L --fail -o stk-assets-full.zip https://github.com/supertuxkart/stk-assets-mobile/releases/download/git/stk-assets-full.zip
          unzip -q stk-assets-full.zip -d stk-assets
          test -d stk-assets/tracks
          test -d stk-assets/karts

      - name: Package like official STK Windows release
        run: |
          ROOT="STK-Rocket-Soccer-Windows-x64"
          mkdir -p "$ROOT/stk-code/build-x86_64"
          cp -a stk-code/build/bin "$ROOT/stk-code/build-x86_64/bin"
          cp -a stk-code/data "$ROOT/stk-code/data"
          cp -a stk-assets "$ROOT/stk-assets"
          cp stk-code/tools/run_game.bat "$ROOT/run_game.bat"
          cp stk-code/COPYING "$ROOT/COPYING" || true
          cat > "$ROOT/README-RUN.txt" <<'EOF'
          STK Rocket Soccer - Windows x64

          Start the game with run_game.bat.
          This package follows SuperTuxKart's official Windows folder layout and uses the same MXE/MinGW x86_64 toolchain path as the official GitHub Actions workflow.
          Keep the entire folder together.
          EOF
          test -f "$ROOT/stk-code/build-x86_64/bin/supertuxkart.exe"
          test -d "$ROOT/stk-code/data"
          test -d "$ROOT/stk-assets/tracks"

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v7
        with:
          name: STK-Rocket-Soccer-Windows-x64-MinGW
          path: STK-Rocket-Soccer-Windows-x64/
          if-no-files-found: error
          compression-level: 6

  android-arm64:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[windows-only]') }}
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v6

      - name: Decode mod bundle
        run: |
          base64 -d mod/stk_rocket_soccer_mod.zip.b64 > stk_rocket_soccer_mod.zip
          unzip -q stk_rocket_soccer_mod.zip -d mod-unpacked

      - name: Clone pinned SuperTuxKart
        run: |
          git clone https://github.com/supertuxkart/stk-code.git
          cd stk-code
          git checkout c6b127792e8ecdf82c28fdd9c8023cffb7084dc0

      - name: Apply Rocket Soccer patch
        run: |
          python3 mod-unpacked/stk_rocket_soccer_mod/apply_rocket_soccer.py stk-code --check
          python3 mod-unpacked/stk_rocket_soccer_mod/apply_rocket_soccer.py stk-code
          python3 - <<'PY'
          from pathlib import Path
          p = Path('stk-code/src/modes/soccer_world.cpp')
          s = p.read_text()
          if '#include <ISceneManager.h>' not in s:
              s = s.replace('#include <IMeshSceneNode.h>', '#include <IMeshSceneNode.h>\n#include <ISceneManager.h>')
              p.write_text(s)
          PY

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake make python3 python3-pip flex bison imagemagick cmake meson vorbis-tools pngquant advancecomp libjpeg-progs optipng ninja-build pkg-config zip unzip
          python3 -m pip install --break-system-packages packaging mako

      - name: Install Android SDK/NDK pieces
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709"

      - name: Download Android dependency sources
        working-directory: stk-code
        run: |
          curl -L --fail -o dependencies-android-src.tar.xz https://github.com/supertuxkart/dependencies/releases/download/preview/dependencies-android-src.tar.xz
          tar -xJf dependencies-android-src.tar.xz -C lib

      - name: Download mobile assets
        run: |
          mkdir -p stk-assets
          curl -L --fail -o stk-assets-full.zip https://github.com/supertuxkart/stk-assets-mobile/releases/download/git/stk-assets-full.zip
          unzip -q stk-assets-full.zip -d stk-assets
          test -d stk-assets/tracks

      - name: Generate Android assets
        working-directory: stk-code/android
        env:
          ASSETS_PATHS: ${{ github.workspace }}/stk-assets
          DECREASE_QUALITY: "1"
          COMPILE_ARCH: aarch64
          BUILD_TYPE: debug
          PROJECT_VERSION: git
        run: ./generate_assets.sh

      - name: Build Android dependencies
        working-directory: stk-code/android
        env:
          SDK_PATH: ${{ env.ANDROID_HOME }}
          NDK_PATH: ${{ env.ANDROID_HOME }}/ndk
          STK_NDK_VERSION: 28.1.13356709
          STK_TARGET_ANDROID_SDK: 35
          COMPILE_ARCH: aarch64
          BUILD_TYPE: debug
          PROJECT_VERSION: git
        run: ./make_deps.sh

      - name: Build APK
        working-directory: stk-code/android
        env:
          SDK_PATH: ${{ env.ANDROID_HOME }}
          NDK_PATH: ${{ env.ANDROID_HOME }}/ndk
          STK_NDK_VERSION: 28.1.13356709
          STK_TARGET_ANDROID_SDK: 35
          COMPILE_ARCH: aarch64
          BUILD_TYPE: debug
          PROJECT_VERSION: git
        run: ./make.sh -j4

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifact-android
          APK="$(find stk-code/android/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK found. Available output files:"
            find stk-code/android/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" artifact-android/STK-Rocket-Soccer-arm64-debug.apk
          test -f artifact-android/STK-Rocket-Soccer-arm64-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: STK-Rocket-Soccer-Android-arm64
          path: artifact-android/STK-Rocket-Soccer-arm64-debug.apk
          if-no-files-found: error
