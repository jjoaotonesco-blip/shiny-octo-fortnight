name: Build STK Rocket Soccer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 EXE
    runs-on: windows-2022
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v6

      - name: Decode mod bundle
        shell: pwsh
        run: |
          $b64 = Get-Content mod/stk_rocket_soccer_mod.zip.b64 -Raw
          [IO.File]::WriteAllBytes("stk_rocket_soccer_mod.zip", [Convert]::FromBase64String($b64))
          Expand-Archive stk_rocket_soccer_mod.zip -DestinationPath mod-unpacked -Force

      - name: Clone pinned SuperTuxKart
        shell: bash
        run: |
          git clone https://github.com/supertuxkart/stk-code.git
          cd stk-code
          git checkout c6b127792e8ecdf82c28fdd9c8023cffb7084dc0

      - name: Apply Rocket Soccer patch
        shell: pwsh
        run: |
          python mod-unpacked/stk_rocket_soccer_mod/apply_rocket_soccer.py stk-code --check
          python mod-unpacked/stk_rocket_soccer_mod/apply_rocket_soccer.py stk-code
          $path = "stk-code/src/modes/soccer_world.cpp"
          $text = Get-Content $path -Raw
          if ($text -notmatch '#include <ISceneManager.h>') {
            $text = $text.Replace('#include <IMeshSceneNode.h>', "#include <IMeshSceneNode.h>`n#include <ISceneManager.h>")
            Set-Content -Path $path -Value $text -NoNewline
          }

      - name: Download Windows dependencies
        shell: bash
        working-directory: stk-code
        run: |
          curl -L --fail -o dependencies-win-x86_64.zip https://github.com/supertuxkart/dependencies/releases/download/preview/dependencies-win-x86_64.zip
          unzip -q dependencies-win-x86_64.zip

      - name: Download matching LLVM runtime
        shell: bash
        run: |
          curl -L --fail -o llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-msvcrt-ubuntu-22.04-x86_64.tar.xz
          mkdir -p llvm-mingw-runtime
          tar -xJf llvm-mingw.tar.xz -C llvm-mingw-runtime
          find llvm-mingw-runtime -type f \( -name 'libc++.dll' -o -name 'libunwind.dll' -o -name 'libc++abi.dll' \) -print

      - name: Download Windows game assets
        shell: bash
        run: |
          mkdir -p stk-assets-win
          curl -L --fail -o stk-assets.zip https://github.com/supertuxkart/stk-assets-mobile/releases/download/git/stk-assets.zip
          unzip -q stk-assets.zip -d stk-assets-win
          test -d stk-assets-win/tracks
          test -d stk-assets-win/karts

      - name: Configure MSVC x64
        shell: pwsh
        working-directory: stk-code
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cd build
          cmake .. -G "Visual Studio 17 2022" -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=x86_64 -A x64 -DCHECK_ASSETS=OFF

      - name: Build EXE
        shell: pwsh
        working-directory: stk-code/build
        run: cmake --build . --config Release --parallel 4

      - name: Collect portable Windows build
        shell: pwsh
        run: |
          Remove-Item artifact-windows -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifact-windows | Out-Null

          $exe = Get-ChildItem stk-code/build -Recurse -File -Filter supertuxkart.exe |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]Release[\\/]supertuxkart\.exe$' } |
            Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem stk-code/build -Recurse -File -Filter supertuxkart.exe | Select-Object -First 1
          }
          if (-not $exe) { throw "supertuxkart.exe not found" }

          $runtime = $exe.Directory.FullName
          Write-Host "Runtime directory: $runtime"
          Copy-Item "$runtime\*" artifact-windows -Recurse -Force

          foreach ($name in @('libc++.dll', 'libunwind.dll', 'libc++abi.dll')) {
            $dll = Get-ChildItem llvm-mingw-runtime -Recurse -File -Filter $name |
              Where-Object { $_.FullName -match 'x86_64-w64-mingw32' } |
              Select-Object -First 1
            if ($dll) {
              Write-Host "Adding LLVM runtime: $($dll.FullName)"
              Copy-Item $dll.FullName "artifact-windows\$name" -Force
            }
          }

          if (!(Test-Path 'artifact-windows\libc++.dll')) {
            throw "Matching libc++.dll was not found in LLVM-MinGW runtime"
          }

          Copy-Item stk-code/data artifact-windows/data -Recurse -Force
          Copy-Item 'stk-assets-win\*' artifact-windows/data -Recurse -Force

          if (!(Test-Path 'artifact-windows\data\supertuxkart.git')) {
            throw "STK data version marker missing"
          }
          if (!(Test-Path 'artifact-windows\data\tracks')) {
            throw "Track assets missing"
          }
          if (!(Test-Path 'artifact-windows\data\karts')) {
            throw "Kart assets missing"
          }

          @"
          STK Rocket Soccer - Windows x64 portable build

          Run: supertuxkart.exe
          Keep the EXE, DLL files and data folder together.
          This build includes the Rocket Soccer C++ modifications and the matching LLVM runtime used by STK's dependency DLLs.
          "@ | Set-Content artifact-windows/README-RUN.txt

          Write-Host "Portable package top-level files:"
          Get-ChildItem artifact-windows | Select-Object Name, Length

      - name: Validate Windows runtime dependencies
        shell: pwsh
        run: |
          foreach ($name in @('supertuxkart.exe','OpenAL32.dll','libastcenc.dll','libc++.dll')) {
            if (!(Test-Path "artifact-windows\$name")) { throw "$name missing from portable package" }
          }
          Write-Host "OpenAL dependencies:"
          dumpbin /DEPENDENTS artifact-windows/OpenAL32.dll
          Write-Host "libastcenc dependencies:"
          dumpbin /DEPENDENTS artifact-windows/libastcenc.dll

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v7
        with:
          name: STK-Rocket-Soccer-Windows-x64-Portable
          path: artifact-windows/
          if-no-files-found: error
          compression-level: 6

  android-arm64:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[windows-only]') }}
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v6

      - name: Decode mod bundle
        run: |
          base64 -d mod/stk_rocket_soccer_mod.zip.b64 > stk_rocket_soccer_mod.zip
          unzip -q stk_rocket_soccer_mod.zip -d mod-unpacked

      - name: Clone pinned SuperTuxKart
        run: |
          git clone https://github.com/supertuxkart/stk-code.git
          cd stk-code
          git checkout c6b127792e8ecdf82c28fdd9c8023cffb7084dc0

      - name: Apply Rocket Soccer patch
        run: |
          python3 mod-unpacked/stk_rocket_soccer_mod/apply_rocket_soccer.py stk-code --check
          python3 mod-unpacked/stk_rocket_soccer_mod/apply_rocket_soccer.py stk-code
          python3 - <<'PY'
          from pathlib import Path
          p = Path('stk-code/src/modes/soccer_world.cpp')
          s = p.read_text()
          if '#include <ISceneManager.h>' not in s:
              s = s.replace('#include <IMeshSceneNode.h>', '#include <IMeshSceneNode.h>\n#include <ISceneManager.h>')
              p.write_text(s)
          PY

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake make python3 python3-pip flex bison imagemagick cmake meson vorbis-tools pngquant advancecomp libjpeg-progs optipng ninja-build pkg-config zip unzip
          python3 -m pip install --break-system-packages packaging mako

      - name: Install Android SDK/NDK pieces
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709"

      - name: Download Android dependency sources
        working-directory: stk-code
        run: |
          curl -L --fail -o dependencies-android-src.tar.xz https://github.com/supertuxkart/dependencies/releases/download/preview/dependencies-android-src.tar.xz
          tar -xJf dependencies-android-src.tar.xz -C lib

      - name: Download mobile assets
        run: |
          mkdir -p stk-assets
          curl -L --fail -o stk-assets-full.zip https://github.com/supertuxkart/stk-assets-mobile/releases/download/git/stk-assets-full.zip
          unzip -q stk-assets-full.zip -d stk-assets
          test -d stk-assets/tracks

      - name: Generate Android assets
        working-directory: stk-code/android
        env:
          ASSETS_PATHS: ${{ github.workspace }}/stk-assets
          DECREASE_QUALITY: "1"
          COMPILE_ARCH: aarch64
          BUILD_TYPE: debug
          PROJECT_VERSION: git
        run: ./generate_assets.sh

      - name: Build Android dependencies
        working-directory: stk-code/android
        env:
          SDK_PATH: ${{ env.ANDROID_HOME }}
          NDK_PATH: ${{ env.ANDROID_HOME }}/ndk
          STK_NDK_VERSION: 28.1.13356709
          STK_TARGET_ANDROID_SDK: 35
          COMPILE_ARCH: aarch64
          BUILD_TYPE: debug
          PROJECT_VERSION: git
        run: ./make_deps.sh

      - name: Build APK
        working-directory: stk-code/android
        env:
          SDK_PATH: ${{ env.ANDROID_HOME }}
          NDK_PATH: ${{ env.ANDROID_HOME }}/ndk
          STK_NDK_VERSION: 28.1.13356709
          STK_TARGET_ANDROID_SDK: 35
          COMPILE_ARCH: aarch64
          BUILD_TYPE: debug
          PROJECT_VERSION: git
        run: ./make.sh -j4

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifact-android
          APK="$(find stk-code/android/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK found. Available output files:"
            find stk-code/android/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" artifact-android/STK-Rocket-Soccer-arm64-debug.apk
          test -f artifact-android/STK-Rocket-Soccer-arm64-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: STK-Rocket-Soccer-Android-arm64
          path: artifact-android/STK-Rocket-Soccer-arm64-debug.apk
          if-no-files-found: error
