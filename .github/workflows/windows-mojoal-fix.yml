name: Windows Rocket Soccer Controls V2

on:
  push:
    paths:
      - 'WINDOWS_MOJOAL_FIX_TRIGGER.txt'
  pull_request:
    paths:
      - 'WINDOWS_MOJOAL_FIX_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 Rocket Soccer ControlsV2
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v6

      - name: Decode known-good mod bundle
        run: |
          curl -L --fail -o stk_rocket_soccer_mod.zip.b64 \
            https://raw.githubusercontent.com/jjoaotonesco-blip/shiny-octo-fortnight/daed57f22ad212546525c9e40807c9a54effb9f0/mod/stk_rocket_soccer_mod.zip.b64
          base64 -d stk_rocket_soccer_mod.zip.b64 > stk_rocket_soccer_mod.zip
          unzip -t stk_rocket_soccer_mod.zip
          unzip -q stk_rocket_soccer_mod.zip -d mod-unpacked
          base64 -d mod/apply_gameplay_fix_v2.py.gz.b64 | gunzip > apply_gameplay_fix_v2.py
          python3 -m py_compile apply_gameplay_fix_v2.py

      - name: Clone pinned SuperTuxKart
        run: |
          git clone https://github.com/supertuxkart/stk-code.git
          cd stk-code
          git checkout c6b127792e8ecdf82c28fdd9c8023cffb7084dc0

      - name: Apply Rocket Soccer V2 patch
        run: |
          python3 mod-unpacked/stk_rocket_soccer_mod/apply_rocket_soccer.py stk-code --check
          python3 mod-unpacked/stk_rocket_soccer_mod/apply_rocket_soccer.py stk-code
          python3 apply_gameplay_fix_v2.py stk-code
          grep -n 'PA_SOCCER_JUMP' stk-code/src/input/input.hpp
          grep -n 'SDL_CONTROLLER_AXIS_TRIGGERRIGHT_UP' stk-code/src/input/gamepad_config.cpp
          grep -n 'dodge_mag < 0.80f' stk-code/src/modes/soccer_world.cpp
          grep -n 'time2Ticks(0.20f)' stk-code/src/modes/soccer_world.cpp
          grep -n 'getSoccerAirRollLeftPressed' stk-code/src/modes/soccer_world.cpp
          grep -n 'm_soccer_ball_cam_button_pressed' stk-code/src/karts/controller/local_player_controller.cpp

      - name: Download STK Windows dependencies
        working-directory: stk-code
        run: |
          curl -L --fail -o dependencies-win-x86_64.zip https://github.com/supertuxkart/dependencies/releases/download/preview/dependencies-win-x86_64.zip
          unzip -q dependencies-win-x86_64.zip

      - name: Install official MXE MinGW toolchain
        run: |
          sudo mkdir -p /data/mxe/usr
          cd /data/mxe/usr
          sudo curl -L --fail -o mxe_static_mingw.zip https://github.com/supertuxkart/dependencies/releases/download/preview/mxe_static_mingw.zip
          sudo unzip -q mxe_static_mingw.zip
          sudo rm mxe_static_mingw.zip
          sudo apt-get update
          sudo apt-get install -y libfl-dev

      - name: Install ISPC
        run: |
          curl -L --fail -o ispc-cross.tar.xz https://github.com/supertuxkart/dependencies/releases/download/preview/ispc-cross-1.26.0.tar.xz
          sudo tar -xJf ispc-cross.tar.xz -C /opt
          test -x /opt/ispc/bin/ispc

      - name: Create x86_64 MinGW CMake toolchain
        working-directory: stk-code
        run: |
          cat > toolchain.cmake <<'EOF'
          SET(CMAKE_SYSTEM_NAME Windows)
          SET(CMAKE_C_COMPILER /data/mxe/usr/bin/x86_64-w64-mingw32.static.posix.seh-gcc)
          SET(CMAKE_CXX_COMPILER /data/mxe/usr/bin/x86_64-w64-mingw32.static.posix.seh-g++)
          SET(CMAKE_RC_COMPILER /data/mxe/usr/bin/x86_64-w64-mingw32.static.posix.seh-windres)
          SET(CMAKE_FIND_ROOT_PATH ${PROJECT_SOURCE_DIR}/dependencies-win-x86_64 /data/mxe/usr/x86_64-w64-mingw32.static.posix.seh/ /data/mxe/usr/lib/gcc/x86_64-w64-mingw32.static.posix.seh/5.5.0/)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ALWAYS)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(ISPC_ARCH "x86-64")
          EOF

      - name: Configure with bundled static MojoAL
        working-directory: stk-code
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=../toolchain.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCHECK_ASSETS=OFF \
            -DUSE_DIRECTX=ON \
            -DUSE_MOJOAL=ON \
            -DBC7_ISPC=ON \
            -DCMAKE_ISPC_COMPILER=/opt/ispc/bin/ispc

      - name: Build Windows EXE
        working-directory: stk-code/build
        run: make -j4

      - name: Validate EXE and audio imports
        shell: bash
        run: |
          EXE=stk-code/build/bin/supertuxkart.exe
          OBJDUMP=/data/mxe/usr/bin/x86_64-w64-mingw32.static.posix.seh-objdump
          test -f "$EXE"
          "$OBJDUMP" -p "$EXE" > imports.txt
          echo '=== DLL imports ==='
          grep -i 'DLL Name' imports.txt || true
          if grep -qi 'OpenAL32\.dll' imports.txt; then
            echo 'ERROR: supertuxkart.exe still imports OpenAL32.dll'
            exit 1
          fi
          echo 'PASS: V2 EXE built with static MojoAL'

      - name: Create replacement package
        run: |
          mkdir -p STK-Rocket-Soccer-Windows-ControlsV2
          cp stk-code/build/bin/supertuxkart.exe STK-Rocket-Soccer-Windows-ControlsV2/
          cp imports.txt STK-Rocket-Soccer-Windows-ControlsV2/imports.txt
          cat > STK-Rocket-Soccer-Windows-ControlsV2/README.txt <<'EOF'
          Rocket Soccer Controls V2

          Xbox / SDL semantic soccer profile:
          RT = accelerate
          LT = brake / reverse
          Left stick left/right = ground steering / air yaw
          Left stick forward/back = air pitch
          A = variable jump / double jump / directional dodge
          B = dedicated 0-100 boost
          X = powerslide on ground / free air roll with left stick in air
          Y = persistent Ball Cam toggle
          LB = Air Roll Left
          RB = Air Roll Right
          Start = normal STK pause

          Mechanics added/tuned:
          - Soccer-specific input layer; normal STK bindings are untouched outside soccer
          - SDL semantic controls, so raw Xbox button numbers are not assumed
          - Hold A up to 0.20s for extra jump height
          - 0.80 directional dodge deadzone
          - 1.35s second-jump/dodge window
          - Boost thrust follows the kart nose for real aerials
          - Small airborne throttle authority
          - Dedicated left/right air roll plus X free air roll
          - Ball Cam remains active until Y is pressed again
          - Ball Cam stays closer behind the kart while aiming at the ball

          Replace only supertuxkart.exe from the previous corrected MinGW package.
          Keep OpenAL32.dll deleted from the runtime folder.
          EOF

      - name: Upload ControlsV2 EXE
        uses: actions/upload-artifact@v7
        with:
          name: STK-Rocket-Soccer-Windows-ControlsV2
          path: STK-Rocket-Soccer-Windows-ControlsV2/
          if-no-files-found: error
          compression-level: 6
